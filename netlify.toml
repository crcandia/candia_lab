[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.97.3"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# Preserve historical URLs with an exact current equivalent.

[[redirects]]
  from = "/tag/bussiness-analytics/"
  to = "/tag/business-analytics/"
  status = 301

[[redirects]]
  from = "/author/melanie/"
  to = "/author/melanie-oyarzun/"
  status = 301

[[redirects]]
  from = "/teaching/complexity-global-school-2025/"
  to = "/event/complexity-global-school-2025/"
  status = 301
