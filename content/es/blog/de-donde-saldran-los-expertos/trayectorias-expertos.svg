<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 663" width="840" height="663" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">IA y formación de expertos: dos efectos posibles</title>
<desc id="diagram-desc">Dos efectos potenciales de automatizar tareas de entrada: menos contrataciones junior y menos oportunidades de experiencia, frente a más asistencia de IA y aprendizaje posiblemente más rápido. El balance permanece abierto.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="838" height="661" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
<text x="420" y="39" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172b4d"><tspan x="420" dy="0">IA y formación de expertos: dos efectos posibles</tspan></text>
<rect x="242" y="68" width="356" height="91" rx="16" fill="#f4f7fa" stroke="#94a3b8" stroke-width="1.4"/>
<text x="420" y="96.475" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#172b4d"><tspan x="420" dy="0">IA aplicada a tareas</tspan><tspan x="420" dy="31.05">de nivel inicial</tspan></text>
<g stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M420 159 V180 H215 V210" marker-end="url(#arrow)"/>
<path d="M420 180 H625 V210" marker-end="url(#arrow)"/>
<path d="M215 291 V326" marker-end="url(#arrow)"/>
<path d="M625 291 V326" marker-end="url(#arrow)"/>
<path d="M215 407 V442" marker-end="url(#arrow)"/>
<path d="M625 407 V442" marker-end="url(#arrow)"/>
</g>
<text x="215" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#98552d"><tspan x="215" dy="0">ESCENARIO A · MENOS ENTRADA</tspan></text>
<text x="625" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#176d62"><tspan x="625" dy="0">ESCENARIO B · MÁS APOYO</tspan></text>
<rect x="45" y="214" width="340" height="77" rx="15" fill="#fff8f2" stroke="#edc5a5" stroke-width="1.4"/><text x="215" y="239.675" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#172b4d"><tspan x="215" dy="0">Menos contratación</tspan><tspan x="215" dy="25.650000000000002">de principiantes</tspan></text><rect x="45" y="330" width="340" height="77" rx="15" fill="#fff8f2" stroke="#edc5a5" stroke-width="1.4"/><text x="215" y="355.675" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#172b4d"><tspan x="215" dy="0">Menos práctica</tspan><tspan x="215" dy="25.650000000000002">con problemas reales</tspan></text><rect x="45" y="446" width="340" height="77" rx="15" fill="#fff8f2" stroke="#edc5a5" stroke-width="1.4"/><text x="215" y="471.675" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172b4d"><tspan x="215" dy="0">Riesgo de menor</tspan><tspan x="215" dy="25.650000000000002">relevo profesional</tspan></text>
<rect x="455" y="214" width="340" height="77" rx="15" fill="#f1faf7" stroke="#a8d7c8" stroke-width="1.4"/><text x="625" y="239.675" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#172b4d"><tspan x="625" dy="0">Asistencia de IA</tspan><tspan x="625" dy="25.650000000000002">a quienes ingresan</tspan></text><rect x="455" y="330" width="340" height="77" rx="15" fill="#f1faf7" stroke="#a8d7c8" stroke-width="1.4"/><text x="625" y="355.675" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#172b4d"><tspan x="625" dy="0">Más orientación</tspan><tspan x="625" dy="25.650000000000002">y retroalimentación</tspan></text><rect x="455" y="446" width="340" height="77" rx="15" fill="#f1faf7" stroke="#a8d7c8" stroke-width="1.4"/><text x="625" y="471.675" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#172b4d"><tspan x="625" dy="0">Posible aprendizaje</tspan><tspan x="625" dy="25.650000000000002">más rápido</tspan></text>
<rect x="44" y="558" width="752" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="420" y="579" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#172b4d"><tspan x="420" dy="0">Ambos efectos pueden coexistir.</tspan></text>
<text x="420" y="611" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172b4d"><tspan x="420" dy="0">Importan el acceso al trabajo y la calidad del aprendizaje.</tspan></text>
<text x="420" y="647" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748b"><tspan x="420" dy="0">Esquema conceptual, no una proyección.</tspan></text>
